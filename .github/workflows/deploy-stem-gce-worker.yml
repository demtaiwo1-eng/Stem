name: Deploy STEM worker to Google Compute Engine

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: stem-gce-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Restart STEM CPU worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate deployment configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM_NAME: ${{ vars.GCP_VM_NAME }}
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          for item in PROJECT_ID ZONE VM_NAME WIF_PROVIDER SERVICE_ACCOUNT; do
            if [ -z "${!item}" ]; then
              echo "::error::Missing GitHub Actions variable: GCP_${item#?}"
              exit 1
            fi
          done

      - name: Check out STEM
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Restart worker and run the latest startup script
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          ZONE: ${{ vars.GCP_ZONE }}
          VM_NAME: ${{ vars.GCP_VM_NAME }}
        run: |
          set -euo pipefail
          gcloud compute instances describe "$VM_NAME" --zone "$ZONE" --project "$PROJECT_ID" --format='value(name)' >/dev/null
          gcloud compute instances reset "$VM_NAME" --zone "$ZONE" --project "$PROJECT_ID" --quiet
          echo "Restart requested. The VM startup script will pull the latest STEM worker code and rebuild the container."
