name: STEM free-processing checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check API JavaScript
        run: node --check server.js
      - name: Check Python workers
        run: python -m py_compile local-worker/worker.py cloud-worker/app.py
