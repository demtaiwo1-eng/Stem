name: Validate STEM engine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Node dependencies
        run: npm install --omit=dev
      - name: Validate Node syntax and dependencies
        run: |
          node --check server.js
          node --check public/app.js
          node -e "require('express'); require('cors'); require('multer'); require('pg'); require('@aws-sdk/client-s3')"
      - name: Validate Python syntax
        run: python -m py_compile worker.py
      - name: Validate project metadata
        run: |
          node -e "const p=require('./package.json'); if(!p.dependencies.express || !p.dependencies.pg || !p.dependencies['@aws-sdk/client-s3']) process.exit(1)"
          test -s requirements.txt
          test -s db/schema.sql
          grep -q '^demucs==' requirements.txt
